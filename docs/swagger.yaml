host: localhost:8080
info:
  contact: {}
  description: Разработка базы данных для управления кинотеатром
  title: Курсовая работа по базам данных - API управления кинотеатром
  version: "1.0"
paths:
  /auth/2fa/disable:
    post:
      description: Выключает двухфакторную аутентификацию для текущего пользователя
      produces:
      - application/json
      responses:
        "200":
          description: 2FA выключена
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Выключить двухфакторную аутентификацию
      tags:
      - Аутентификация
  /auth/2fa/enable:
    post:
      description: Включает двухфакторную аутентификацию для текущего пользователя
      produces:
      - application/json
      responses:
        "200":
          description: 2FA включена
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Включить двухфакторную аутентификацию
      tags:
      - Аутентификация
  /auth/2fa/info:
    get:
      description: Получает информацию о статусе двухфакторной аутентификации текущего
        пользователя
      produces:
      - application/json
      responses:
        "200":
          description: Информация о 2FA
          schema:
            $ref: '#/definitions/dto.TwoFAInfoResponse'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить информацию о 2FA
      tags:
      - Аутентификация
  /auth/login:
    post:
      consumes:
      - application/json
